# Advisory AI review on every pull request, from outerloop (outerloop-science/outerloop, public).
# It posts findings as a PR review; it never approves, never blocks CI, and never runs the PR's
# code. PRs from forks are skipped so they cannot reach the key. Re-run a review by applying the
# `outerloop:review` label; silence one PR with `outerloop:no-review`. Docs: outerloop/docs/reviewer.md.
#
# Backend: codex with no `model`, so the review runs on the model outerloop pins next to its Codex
# CLI version (`model` under `[codex]` in outerloop's src/outerloop/harnesses.toml). Model upgrades
# arrive with outerloop releases and need no change here; no file in this repo names a model.
# Needs the repository secret OPENAI_REVIEWER_KEY (a spend-capped key used only for reviews).
# Without it every PR gets a visible "could not run" stub, by design.
name: outerloop-review
on:
  pull_request_target:
    types: [opened, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Skip PRs carrying outerloop:no-review here too (the reviewer also honors it), so an opted-out PR
    # never even starts a run. Otherwise run on open/reopen and on the outerloop:review label.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'outerloop:no-review')
      && (github.event.action != 'labeled' || github.event.label.name == 'outerloop:review')
    # Pinned to an exact outerloop commit; main moves. The default-to-pinned-model change is on main
    # but not yet in a release (v0.6.0 lacks it). Once a release includes it, move `uses:` and
    # `reviewer_ref` together to that tag. Keep both refs identical.
    uses: outerloop-science/outerloop/.github/workflows/advisory-review-agent.yml@d93d415e7c1926a098a59b474a2f5384a3078e8b
    with:
      bot_login: relay-bot   # PRs by this login are never reviewed; we have no bot yet, so everything is reviewed
      backend: codex
      reviewer_ref: d93d415e7c1926a098a59b474a2f5384a3078e8b
    secrets:
      openai_reviewer_key: ${{ secrets.OPENAI_REVIEWER_KEY }}
