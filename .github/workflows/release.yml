name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: relay, file: deploy/docker/relay/Dockerfile }
          - { name: relay-ingest, file: deploy/docker/ingest/Dockerfile }
          - { name: relay-hermes, file: deploy/docker/hermes/Dockerfile }
          - { name: relay-sandbox, file: deploy/docker/sandbox/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/relayagents/${{ matrix.name }}:latest
            ghcr.io/relayagents/${{ matrix.name }}:${{ github.ref_name }}
