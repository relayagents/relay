name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: relay, file: deploy/docker/relay/Dockerfile }
          - { name: relay-ingest, file: deploy/docker/ingest/Dockerfile }
          # The GPU image docker-compose.gpu.yml pulls: relay-ingest:cuda and relay-ingest:<tag>-cuda.
          - { name: relay-ingest, file: deploy/docker/ingest/Dockerfile, variant: cuda, build_args: TORCH_VARIANT=cu128 }
          - { name: relay-hermes, file: deploy/docker/hermes/Dockerfile }
          - { name: relay-sandbox, file: deploy/docker/sandbox/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/relayagents/${{ matrix.name }}:${{ matrix.variant || 'latest' }}
            ghcr.io/relayagents/${{ matrix.name }}:${{ github.ref_name }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
