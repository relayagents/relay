[alembic]
script_location = src/relayagents/core/migrations
prepend_sys_path = src
# The URL is read from RELAY_DATABASE_URL in env.py; this is only a placeholder.
sqlalchemy.url = postgresql+asyncpg://relay:relay@localhost:5432/relay

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
