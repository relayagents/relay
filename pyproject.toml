[project]
name = "relayagents"
version = "0.1.0"
description = "Relay: the shared memory and switchboard for teams whose members each run their own AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Agentic Learning AI Lab" }]
keywords = ["agents", "mcp", "a2a", "team-memory", "meetings"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "pgvector>=0.4",
  "arq>=0.26",
  "redis>=5.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "pydantic-ai-slim[openai,anthropic]>=2.0",
  "mcp>=2.0",
  "slack-bolt>=1.23",
  "aiohttp>=3.11",
  "typer>=0.16",
  "httpx>=0.28",
  "structlog>=25",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
graph = ["graphiti-core[kuzu]>=0.30"]
ingest = ["whisperx>=3.4"]

[project.scripts]
relay = "relayagents.cli.main:app"

[project.urls]
Homepage = "https://relayagents.dev"
Repository = "https://github.com/relayagents/relay"
Documentation = "https://github.com/relayagents/relay/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relayagents"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012", "E501"]  # the formatter wraps code; long strings and comments are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
